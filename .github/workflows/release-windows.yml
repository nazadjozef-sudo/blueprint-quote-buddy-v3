name: Build & publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Electron app & Upload to Supabase
        shell: bash
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        run: |
          # 1. Spustíme kompletný build pre Electron (Vite + esbuild pre updater)
          npm run electron:build
          
          # 2. Zabalíme Electron aplikáciu pomocou tvojho electron-builder.yml
          npx electron-builder --win --config electron-builder.yml --publish never
          
          # 3. Nahrajeme výstup do Supabase
          node scripts/upload-release.mjs
