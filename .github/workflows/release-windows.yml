name: Build & publish Windows release

# Builds the NSIS installer on a Windows runner and publishes the artifacts
# (installer, .blockmap, latest.yml) DIRECTLY to Supabase Storage.
# No GitHub Releases, no GH_TOKEN, no manual steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Electron app & Upload to Supabase
        shell: bash
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        run: |
          npm run build:electron
          npx electron-builder --win --config.publish.provider=generic --config.publish.url="https://dummy.url"
          node scripts/upload-release.mjs
