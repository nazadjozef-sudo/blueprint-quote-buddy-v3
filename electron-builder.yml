appId: com.blueprint.drawinganalyzer
productName: DrawingAnalyzer
copyright: Copyright © 2026 DrawingAnalyzer

directories:
  output: release
  buildResources: build

# Only ship what the app actually needs at runtime.
files:
  - dist/**/*
  - electron/main.cjs
  - electron/updater.bundle.cjs
  - package.json
  - "!**/node_modules/**"

protocols:
  - name: BlueprintApp
    schemes:
      - blueprintapp

publish:
  - provider: generic
    url: https://pmzahzrecdyrwnfnlywf.supabase.co/functions/v1/updates
    channel: latest
    useMultipleRangeRequest: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DrawingAnalyzer

mac:
  target:
    - target: dmg
      arch:
        - x64
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility
npmRebuild: false
buildDependenciesFromSource: false
